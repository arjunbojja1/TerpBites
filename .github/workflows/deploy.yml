name: Refresh dining data and deploy

on:
  schedule:
    # Every day at 5 AM Eastern (9:00 UTC during daylight time, 4 AM in winter)
    - cron: "0 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull fresh UMD dining data
        # If UMD's sites are down, deploy with the data already in the repo.
        continue-on-error: true
        env:
          TZ: America/New_York
        run: python3 scripts/update_data.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
