name: Refresh dining data and deploy

on:
  schedule:
    # Every day at 5 AM Eastern (9:00 UTC during daylight time, 4 AM in winter)
    - cron: "0 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull fresh UMD dining data
        # If UMD's sites are down, deploy with the data already in the repo.
        continue-on-error: true
        env:
          TZ: America/New_York
        run: python3 scripts/update_data.py

      - name: Build findings report PDF
        # A typo in the report should never take the website down.
        continue-on-error: true
        run: |
          pip install --quiet markdown
          python3 report/build.py
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --allow-file-access-from-files --virtual-time-budget=10000 \
            --print-to-pdf="$PWD/report/TerpBites_Findings.pdf" "file://$PWD/report/findings.html"
          ls -la report/TerpBites_Findings.pdf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
